name: CI

on:
  pull_request:
  push:
    branches: [main]

# Solo lectura: el workflow no necesita escribir en el repo
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Este nombre es el check obligatorio de la protección de main
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias (lockfile exacto)
        run: npm ci

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tests unitarios
        run: npm test

      - name: Build
        run: npm run build

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run test:e2e

      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
