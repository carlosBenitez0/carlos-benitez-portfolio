<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta
      name="theme-color"
      content="#050010"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f4effc"
      media="(prefers-color-scheme: light)"
    />
    <!-- Mismo tema que el portafolio (preferencia guardada o del sistema) -->
    <script src="/theme-init.js"></script>
    <title>Página no encontrada | Carlos Benítez</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    />
    <!-- Estilos en archivo aparte: la CSP no permite estilos inline -->
    <link rel="stylesheet" href="/404.css" />
  </head>
  <body>
    <main class="not-found">
      <img
        class="logo"
        src="/images/logo-cb.webp"
        alt="Carlos Benítez"
        width="56"
        height="56"
      />
      <p class="code" aria-hidden="true">404</p>
      <h1>Esta página no existe</h1>
      <p class="text">
        Puede que el enlace esté mal escrito o que la página se haya movido.
      </p>
      <a class="home" href="/">Volver al portafolio</a>
    </main>
  </body>
</html>
